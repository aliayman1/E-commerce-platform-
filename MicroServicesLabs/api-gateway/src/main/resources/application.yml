server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/ecommerce-platform
          jwk-set-uri: http://localhost:8090/realms/ecommerce-platform/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: product-service-v1
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
            - AddResponseHeader=X-Platform, microservices-pro
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
        - id: product-service-legacy-redirect # remove after ONE deprecation cycle
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products(?<segment>/?.*), /api/v1/products${segment}
            - AddResponseHeader=Deprecation, true
            # Shortcut syntax splits on commas, which would cut the HTTP-date in half
            - name: AddResponseHeader
              args:
                name: Sunset
                value: "Wed, 01 Oct 2026 00:00:00 GMT"
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info