spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:http://localhost:8888"
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "com.microservices.pro.*"
      spring.json.type.mapping: "orderPlaced:com.microservices.pro.order.events.OrderPlacedEvent,inventoryReserved:com.microservices.pro.order.events.InventoryReservedEvent,inventoryReservationFailed:com.microservices.pro.order.events.InventoryReservationFailedEvent,paymentCompleted:com.microservices.pro.order.events.PaymentCompletedEvent,paymentFailed:com.microservices.pro.order.events.PaymentFailedEvent,inventoryReleased:com.microservices.pro.order.events.InventoryReleasedEvent,orderConfirmed:com.microservices.pro.order.events.OrderConfirmedEvent,orderCancelled:com.microservices.pro.order.events.OrderCancelledEvent,reserveInventoryCommand:com.microservices.pro.order.saga.ReserveInventoryCommand,processPaymentCommand:com.microservices.pro.order.saga.ProcessPaymentCommand,releaseInventoryCommand:com.microservices.pro.order.saga.ReleaseInventoryCommand,inventoryResult:com.microservices.pro.order.saga.InventoryResultEvent,paymentResult:com.microservices.pro.order.saga.PaymentResultEvent"

payment-service:
  url: http://localhost:8083

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info