apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  # Deliberately broad: matches both track: stable and track: canary pods, so
  # kube-proxy load-balances across every pod of either Deployment. This is the
  # mechanism the canary split relies on - do not narrow it.
  selector:
    app: product-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP