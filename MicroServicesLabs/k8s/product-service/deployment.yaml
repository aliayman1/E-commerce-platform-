apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    # track: stable keeps this selector from overlapping the canary Deployment's.
    # With the slides' bare { app: product-service } the stable selector is a
    # superset of the canary's labels, which Kubernetes flags as overlapping and
    # which makes replica accounting unpredictable across the two Deployments.
    matchLabels: { app: product-service, track: stable }
  template:
    metadata:
      labels: { app: product-service, track: stable, version: stable }
    spec:
      containers:
        - name: product-service
          image: ghcr.io/ahmeddkamar/microservices-course-labs/product-service:sha-69778e4
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef:
                name: product-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: product-secrets, key: DB_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60 # Spring Boot + JPA needs time to start
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30 # readiness checked earlier - pod might be alive before ready
            periodSeconds: 5
            failureThreshold: 3